name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest #GitHub uruchamia wirtualną maszynę Linux (Ubuntu).

    services:
      postgres:
        image: postgres:16 #uruchamia kontener docker z postresql
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_test #tworzy baze
        ports:
          - 5432:5432
        options: >- #sprawdza czy baza gotow zanim odpali testy 
          --health-cmd="pg_isready -U booking -d booking_test"  
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4 #GitHub pobiera Twój kod z repozytorium.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov respx "pydantic[email]"

      - name: Install psql client (for pg_isready)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres #laczy sie z baza max 30x po 2 s
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U booking -d booking_test && exit 0
            sleep 2
          done
          echo "Postgres not ready" && exit 1
        env:
          PGPASSWORD: booking

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://booking:booking@localhost:5432/booking_test
          TEST_DATABASE_URL: postgresql+psycopg://booking:booking@localhost:5432/booking_test
        run: |
          pytest --cov=app --cov-report=term-missing